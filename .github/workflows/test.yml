name: test
on:
  push:
  pull_request:
jobs:
  test:
    # Windows is the platform the app runs on; Linux covers the window
    # tests under a virtual display.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The suite takes about a minute. Without a limit a hung apt mirror or
    # Xvfb start sits silently for GitHub's 6-hour default (2026-10-07: 33
    # minutes with no output before it was cancelled).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        if: runner.os == 'Windows'
      - name: Unit + window tests (virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a python -m unittest discover -s tests -v
