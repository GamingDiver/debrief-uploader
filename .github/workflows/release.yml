name: release
# Push a tag like v1.3.1 (matching debrief_uploader/__version__) to publish
# DebriefUploader.zip and DebriefUploader_Setup_<version>.exe as a GitHub Release.
# package.sh refuses to build the zip unless the tests, the window tests and a
# run of the unpacked zip all pass; the installer's exe must pass `doctor`.
# Run it by hand (Actions -> release -> Run workflow) to build and check both
# downloads without publishing; they are kept as run artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-tests:
    # the app runs on Windows; v1.3.2 shipped a socket bug only Windows shows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build-zip:
    needs: windows-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(python3 -c 'import debrief_uploader; print(debrief_uploader.__version__)')"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb zip
      - run: python3 -m pip install -r requirements.txt
      - name: Build (tests gate the zip)
        run: xvfb-run -a bash package.sh "$PWD/DebriefUploader.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: zip
          path: DebriefUploader.zip

  build-installer:
    needs: windows-tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Read version
        shell: bash
        run: |
          v="$(python -c 'import debrief_uploader; print(debrief_uploader.__version__)')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
      - name: Build exe
        # no console: it would otherwise pop up a terminal at every log-on
        shell: pwsh
        run: ./Build-Exe.ps1 -NoConsole
      - name: Check exe exists
        shell: pwsh
        run: if (-not (Test-Path dist/DebriefUploader.exe)) { throw "exe missing" }
      - name: Run the built exe
        # A windowed exe: pwsh does not wait for it, and an uncaught error opens
        # a dialog that never closes, so wait with a deadline. `doctor` exits 1
        # when the tray cannot load (missing hidden import or icon).
        shell: pwsh
        run: |
          $p = Start-Process dist/DebriefUploader.exe -ArgumentList doctor -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "exe did not exit within 2 minutes" }
          if ($p.ExitCode -ne 0) { throw "DebriefUploader.exe doctor exited $($p.ExitCode)" }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: iscc /DAppVersion=$env:APP_VERSION installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer_output/DebriefUploader_Setup_*.exe

  publish:
    needs: [build-zip, build-installer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Debrief Uploader ${GITHUB_REF_NAME}" \
            --generate-notes
