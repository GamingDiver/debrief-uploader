name: release
# Push a tag like v1.3.1 (matching debrief_uploader/__version__) to publish
# DebriefUploader.zip and DebriefUploader_Setup_<version>.exe as a GitHub Release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build-zip:
    needs: windows-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          v="$(python3 -c 'import debrief_uploader; print(debrief_uploader.__version__)')"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb zip
      - run: python3 -m pip install -r requirements.txt
      - name: Build (tests gate the zip)
        run: xvfb-run -a bash package.sh "$PWD/DebriefUploader.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: zip
          path: DebriefUploader.zip

  build-installer:
    needs: windows-tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Read version
        shell: bash
        run: |
          v="$(python -c 'import debrief_uploader; print(debrief_uploader.__version__)')"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
      - name: Build exe
        shell: pwsh
        run: ./Build-Exe.ps1
      - name: Check exe exists
        shell: pwsh
        run: if (-not (Test-Path dist/DebriefUploader.exe)) { throw "exe missing" }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: iscc /DAppVersion=$env:APP_VERSION installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer_output/DebriefUploader_Setup_*.exe

  publish:
    needs: [build-zip, build-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Debrief Uploader ${GITHUB_REF_NAME}" \
            --generate-notes